     document.getElementById('saveWebsiteContent')?.addEventListener('click',saveWebsiteEditor);
     document.getElementById('reloadWebsiteContent')?.addEventListener('click',loadWebsiteEditor);
     document.getElementById('resetWebsiteContent')?.addEventListener('click',async()=>{try{const r=await fetch('/api/site-content',{cache:'no-store'}),d=await r.json();document.getElementById('websiteContentJson').value=JSON.stringify(d.content,null,2);document.getElementById('websiteContentStatus').textContent='Sample defaults loaded in the editor. Click Save to publish.';}catch(e){document.getElementById('websiteContentStatus').textContent='Could not load sample defaults.';}});

    document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.view)));
    document.querySelectorAll('[data-nav-sub]').forEach(b=>b.addEventListener('click',()=>{
      const view=b.dataset.navSub; navigate(view);
      if(view==='orders'){
        const filter=b.dataset.navFilter||'all';
        activeOrderFilter=filter==='payment_review'?'unpaid':filter;
        document.querySelectorAll('[data-order-filter]').forEach(x=>x.classList.toggle('active',x.dataset.orderFilter===activeOrderFilter));
        renderOrders();
        if(filter==='payment_review'){
          document.getElementById('orderSearch').value='';
          const body=document.getElementById('ordersBody');
          const rows=orders.filter(o=>o.cash_reported_at&&o.cash_payment_status!=='paid');
          body.innerHTML=rows.map(o=>{const i=orders.indexOf(o),p=professionalForOrder(o);return '<tr data-order-id="'+esc(o.id)+'"><td><b>#'+orderNumber(i)+'</b><br><small>'+esc(o.tracking_code||'')+'</small></td><td>'+esc(o.customer_name)+'<br><small>'+esc(o.phone)+'</small></td><td>'+esc(o.service_type)+'</td><td>'+esc(o.pickup_date||'—')+'</td><td>'+esc(p?.full_name||'—')+'<br><small>'+esc(p?.phone||'')+'</small></td><td>'+esc(statusLabel(o.status))+'</td><td><span class="ad-status status-pending">Reported · verify</span><br><button class="ad-detail-btn" data-verify-cash="'+esc(o.id)+'">Verify payment</button></td><td><button class="ad-detail-btn" data-order-detail="'+esc(o.id)+'">View details</button></td></tr>';}).join('')||'<tr><td colspan="8">No payments awaiting verification.</td></tr>';
        }
      }else if(view==='assignments'){loadOperations();}
    }));

    document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();navigate(b.dataset.goto);}));
    document.getElementById('adminMenuToggle')?.addEventListener('click',()=>document.getElementById('adminSidebar').classList.toggle('open'));
    document.getElementById('refreshAssignmentStatus')?.addEventListener('click',refresh);
    document.getElementById('refreshOrders')?.addEventListener('click',refresh);
    document.getElementById('orderSearch')?.addEventListener('input',renderOrders);
    document.getElementById('ordersBody')?.addEventListener('change',async e=>{
      const row=e.target.closest('tr[data-order-id]');if(!row)return;const id=row.dataset.orderId;
      if(e.target.matches('.cash-status'))return;
      if(!e.target.matches('.order-status'))return;
      const status=e.target.value;e.target.disabled=true;notice.textContent='Updating order status…';
      try{await adminApi('PATCH',{id,status});await refresh();notice.textContent='Order status updated.';}
      catch(error){notice.textContent=error.message;await refresh();}
    });
    document.getElementById('ordersBody')?.addEventListener('click',async e=>{const verify=e.target.closest('[data-verify-cash]');if(verify){verify.disabled=true;notice.textContent='Verifying cash payment…';try{await adminApi('PATCH',{id:verify.dataset.verifyCash,cash_payment_action:'verify'});await refresh();notice.textContent='Cash payment verified and recorded.';}catch(err){notice.textContent=err.message;await refresh();}return;}const detail=e.target.closest('[data-order-detail]');if(detail){showOrderDetails(detail.dataset.orderDetail);return;}const b=e.target.closest('.delete-order');if(b)deleteOrder(b.closest('tr').dataset.orderId);});
    document.getElementById('closeOrderDetail')?.addEventListener('click',()=>document.getElementById('orderDetailModal').classList.remove('open'));
    document.getElementById('orderDetailModal')?.addEventListener('click',e=>{if(e.target.id==='orderDetailModal')e.currentTarget.classList.remove('open');});
    document.querySelectorAll('[data-order-filter]').forEach(b=>b.addEventListener('click',()=>{activeOrderFilter=b.dataset.orderFilter;document.querySelectorAll('[data-order-filter]').forEach(x=>x.classList.toggle('active',x===b));renderOrders();}));
    document.getElementById('recentOrdersBody')?.addEventListener('click',e=>{const b=e.target.closest('[data-delete-id]');if(b)deleteOrder(b.dataset.deleteId);});
    document.getElementById('quickDelete')?.addEventListener('click',()=>{if(currentRole!=='super_admin'){notice.textContent='Only Super Admin can delete orders.';return;}navigate('orders');notice.textContent='Choose an order and use its delete control.';});
    document.getElementById('logoutAdmin')?.addEventListener('click',async()=>{await client.auth.signOut();currentUser=null;panel.hidden=true;login.hidden=false;loginForm.reset();message.textContent='You have signed out.';});
    document.getElementById('forgotPassword')?.addEventListener('click',async()=>{
      message.textContent='';const email=document.getElementById('adminEmail').value.trim();if(!email){message.textContent='Enter your admin email first.';return;}
      const button=document.getElementById('forgotPassword');button.disabled=true;
      try{const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/admin/reset-password'});if(error)throw error;message.style.color='#067647';message.textContent='If this account exists, a password recovery email has been sent. Check your inbox and spam folder.';}
      catch(e){message.textContent=e.message||'Could not send recovery email.';}finally{button.disabled=false;}
    });
    document.getElementById('adminResetForm')?.addEventListener('submit',async e=>{
      e.preventDefault();const p=document.getElementById('newAdminPassword').value,c=document.getElementById('confirmAdminPassword').value;
      if(p.length<8){resetMessage.textContent='Use at least 8 characters.';return;}if(p!==c){resetMessage.textContent='The passwords do not match.';return;}
      const b=document.getElementById('saveAdminPassword');b.disabled=true;resetMessage.textContent='';
      try{const {data:{session},error:se}=await client.auth.getSession();if(se||!session)throw new Error('Your recovery link is invalid or expired.');const {error}=await client.auth.updateUser({password:p});if(error)throw error;resetMessage.style.color='#067647';resetMessage.textContent='Password updated. Opening Admin Login…';setTimeout(()=>location.assign('/admin/login'),900);}
      catch(err){resetMessage.textContent=err.message||'Could not update password.';}finally{b.disabled=false;}
    });
    const resetRoute=location.pathname.replace(/\/+$/,'')==='/admin/reset-password';
    if(resetRoute){
      login.hidden=true;resetPanel.hidden=false;
      const {data:{session},error}=await client.auth.getSession();
      if(error||!session){resetMessage.textContent='This password reset link is invalid or expired. Request a new recovery email.';document.getElementById('saveAdminPassword').disabled=true;}
    }
    document.addEventListener('submit',async e=>{
      if(e.target?.id!=='adminLoginForm')return;
      e.preventDefault();message.textContent='';loginButton.disabled=true;loginButton.textContent='Signing in…';
      try{const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('adminEmail').value.trim(),password:document.getElementById('adminPassword').value});if(error)throw error;await showDashboard(data.user);}
      catch(err){message.textContent=err.message||'Sign-in failed.';if(client)await client.auth.signOut().catch(()=>{});}
      finally{loginButton.disabled=false;loginButton.textContent='Sign in';}
    });
    try{const {data:{session}}=await client.auth.getSession();if(session?.user&&!resetRoute){await showDashboard(session.user);}}
    catch(e){if(panel)panel.hidden=true;if(login)login.hidden=false;if(message)message.textContent=e.message||'Could not verify administrator permissions.';}
  })();
}
});
</script></body></html>
